# Defaults for scripts/download.sh. Anything passed on the command line wins.

# Best video up to 1080p plus best audio, merged into one MP4.
-f "bv*[height<=1080]+ba/b[height<=1080]/b"
--merge-output-format mp4

# Prefer H.264 + AAC when the site offers it: every editor reads it without transcoding.
-S "vcodec:h264,res,acodec:m4a"

# Plain ASCII names (id first, so always unique) keep every later tool happy.
# Non-Latin titles are dropped from the name; the full title is in the .info.json.
-o "%(id)s.%(title).60B.%(ext)s"
--restrict-filenames

# Sidecar metadata: handy for credits and for finding the source again.
--write-info-json
--no-playlist

# YouTube needs a JavaScript runtime; Node is already installed here.
--js-runtimes node
