<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>בונה האפליקציות</title>
<style>
:root {
  --bg: #f4f2ff; --card: #fff; --ink: #17132e; --muted: #6b6690; --line: #e3def8; --soft: #efebff;
  --pri: #6a4cff; --pri2: #a36bff; --ok: #19a974; --bad: #e5484d;
  --r: 16px; --shadow: 0 6px 22px rgba(70, 40, 170, .10);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #120f22; --card: #1d1934; --ink: #f1eeff; --muted: #a29cc8; --line: #2f2a52; --soft: #262046; --shadow: 0 6px 22px rgba(0,0,0,.35); }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: system-ui, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif; font-size: 16px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }
header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--card); box-shadow: var(--shadow); z-index: 2; }
header h1 { margin: 0; font-size: 1.25rem; background: linear-gradient(90deg, var(--pri), var(--pri2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
header .grow { flex: 1; }
.icon-btn { border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 8px 12px; }
.btn { border: none; border-radius: 12px; padding: 10px 16px; background: linear-gradient(135deg, var(--pri), var(--pri2)); color: #fff; font-weight: 700; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-ghost { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 12px; }
.btn-danger { color: var(--bad); }

main { display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
.side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--card); }
.stage { display: flex; flex-direction: column; min-height: 0; padding: 12px; gap: 10px; }

.project-bar { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
.project-bar select { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--soft); }

.chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 10px 12px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-width: 95%; }
.msg.user { align-self: flex-start; background: linear-gradient(135deg, var(--pri), var(--pri2)); color: #fff; }
.msg.bot { align-self: flex-end; background: var(--soft); }
.msg.err { align-self: stretch; background: #ffe5e6; color: #8a1c20; }
.msg .small { font-size: .85rem; color: var(--muted); }

.welcome { white-space: normal; }
.tabs button { white-space: nowrap; }
.welcome h2 { margin: 4px 0 6px; font-size: 1.1rem; }
.welcome p { margin: 0 0 10px; color: var(--muted); font-size: .95rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: .9rem; }
.chip:hover { border-color: var(--pri); }
.label { font-size: .8rem; color: var(--muted); margin: 12px 0 6px; font-weight: 700; }

.composer { padding: 10px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.composer textarea { width: 100%; min-height: 70px; max-height: 200px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--soft); }
.composer .row { display: flex; gap: 8px; align-items: center; }
.composer .status { flex: 1; font-size: .85rem; color: var(--muted); }

.toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tabs { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.tabs button { border: none; background: none; padding: 6px 12px; border-radius: 9px; }
.tabs button.on { background: var(--pri); color: #fff; }
.toolbar .grow { flex: 1; }

.frame-wrap { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: stretch; background: var(--soft); border-radius: var(--r); padding: 10px; }
.frame-wrap iframe { width: 100%; height: 100%; border: none; border-radius: 12px; background: #fff; box-shadow: var(--shadow); transition: width .25s; }
.frame-wrap.phone iframe { width: 390px; max-width: 100%; }
.empty { margin: auto; text-align: center; color: var(--muted); }
.empty .big { font-size: 3rem; }
#code { flex: 1; min-height: 0; width: 100%; resize: none; border: 1px solid var(--line); border-radius: var(--r); padding: 12px;
  background: #15122a; color: #e9e5ff; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5; direction: ltr; text-align: left; tab-size: 2; }

dialog { border: none; border-radius: 18px; padding: 20px; width: min(460px, calc(100vw - 32px)); background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 5, 30, .5); }
dialog h3 { margin: 0 0 8px; }
dialog p { color: var(--muted); font-size: .92rem; line-height: 1.5; }
dialog input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--soft); direction: ltr; }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
dialog a { color: var(--pri); }

.mobile-switch { display: none; }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; }
  .side, .stage { display: none; }
  main.show-chat .side, main.show-stage .stage { display: flex; }
  .side { border-left: none; }
  .mobile-switch { display: inline-flex; }
  header h1 { font-size: 1.05rem; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>✨ בונה האפליקציות</h1>
    <div class="grow"></div>
    <div class="tabs mobile-switch">
      <button data-mview="chat" class="on">💬 צ'אט</button>
      <button data-mview="stage">👀 תוצאה</button>
    </div>
    <button class="icon-btn" id="settingsBtn" title="הגדרות">⚙️</button>
  </header>

  <main id="main" class="show-chat">
    <aside class="side">
      <div class="project-bar">
        <select id="projectSelect" aria-label="הפרויקטים שלי"></select>
        <button class="btn-ghost" id="newBtn" title="פרויקט חדש">➕</button>
        <button class="btn-ghost" id="renameBtn" title="שינוי שם">✏️</button>
        <button class="btn-ghost btn-danger" id="deleteBtn" title="מחיקה">🗑️</button>
      </div>
      <div class="chat" id="chat"></div>
      <div class="composer">
        <textarea id="prompt" placeholder="תאר מה לבנות... למשל: משחק שבו לוחצים על בלונים לפני שהם עפים"></textarea>
        <div class="row">
          <span class="status" id="status"></span>
          <button class="btn-ghost" id="stopBtn" hidden>⏹ עצור</button>
          <button class="btn" id="sendBtn">🚀 בנה</button>
        </div>
      </div>
    </aside>

    <section class="stage">
      <div class="toolbar">
        <div class="tabs">
          <button data-view="preview" class="on">👀 תצוגה</button>
          <button data-view="code">🧩 קוד</button>
        </div>
        <div class="tabs">
          <button data-device="desktop" class="on" title="מחשב">💻</button>
          <button data-device="phone" title="טלפון">📱</button>
        </div>
        <div class="grow"></div>
        <button class="btn-ghost" id="runBtn" title="הפעל מחדש">▶️ הפעל</button>
        <button class="btn-ghost" id="openBtn" title="פתח בלשונית חדשה">↗️ פתח</button>
        <button class="btn-ghost" id="copyBtn">📋 העתק</button>
        <button class="btn-ghost" id="downloadBtn">⬇️ הורד</button>
      </div>
      <div class="frame-wrap" id="frameWrap">
        <div class="empty" id="empty"><div class="big">🏗️</div><div>כאן תופיע האפליקציה שלך</div></div>
        <iframe id="frame" title="תצוגה מקדימה" hidden
          sandbox="allow-scripts allow-forms allow-modals allow-popups allow-pointer-lock"></iframe>
      </div>
      <textarea id="code" spellcheck="false" hidden placeholder="<!DOCTYPE html> ..."></textarea>
    </section>
  </main>
</div>

<dialog id="settings">
  <h3>⚙️ הגדרות</h3>
  <p>כדי שהבונה יוכל לבנות כל דבר שתתאר במילים, הוא צריך מפתח של Claude API.
    אפשר להשיג אחד ב־<a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">platform.claude.com</a>.
    המפתח נשמר רק בדפדפן הזה ונשלח רק ל־Anthropic.</p>
  <p>בלי מפתח עדיין אפשר להתחיל מאחת התבניות המוכנות ולערוך את הקוד בעצמך.</p>
  <input id="keyInput" type="password" placeholder="sk-ant-..." autocomplete="off">
  <div class="row">
    <button class="btn-ghost btn-danger" id="clearKeyBtn">מחק מפתח</button>
    <button class="btn-ghost" id="closeSettingsBtn">ביטול</button>
    <button class="btn" id="saveKeyBtn">שמור</button>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
